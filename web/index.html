<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粘粘虫语生成器 · wormlang</title>
<style>
  :root {
    --bg: #071a2b;
    --bg2: #0d2740;
    --card: #103354;
    --line: #1d4b73;
    --ink: #dff1ff;
    --muted: #84a9c9;
    --accent: #47d6c2;
    --accent2: #6ea8ff;
    --danger: #ff8095;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 600px at 20% -10%, #12456e, transparent),
                radial-gradient(900px 500px at 100% 0%, #0a3550, transparent),
                var(--bg);
    min-height: 100vh;
  }
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 2px; }
  h1 span { color: var(--accent); }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .card {
    background: linear-gradient(180deg, var(--card), var(--bg2));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; min-height: 34px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: #0a2a44; border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 10px; font-size: 15px;
  }
  .chip b { font-weight: 600; }
  .chip button {
    border: 0; background: transparent; color: var(--danger);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px;
  }
  input[type=text], textarea {
    width: 100%; background: #081f33; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; font-family: inherit;
    outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--accent2); }
  textarea { min-height: 190px; resize: vertical; line-height: 1.6; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; align-items: center; }
  .row input[type=text] { flex: 1 1 220px; }
  button {
    background: #0a2a44; color: var(--ink); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: .15s;
  }
  button:hover { border-color: var(--accent2); }
  button.primary { background: linear-gradient(180deg, #1c8f80, #12695e); border-color: #1fa695; }
  button.primary:hover { filter: brightness(1.12); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  label.inline {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap;
  }
  label.inline input[type=text] { width: 90px; }
  select {
    background: #081f33; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; font-size: 14px; font-family: inherit;
  }
  .info { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .info.err { color: var(--danger); }
  .info b { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>粘粘虫语<span>生成器</span></h1>
  <p class="sub">把文字编码成一串「虫语」，或反向解码。词表 >= 2 个，词之间不能互为前缀。</p>

  <section class="card">
    <label>配置 1 · 词表（编码词，每个词是一位「N 进制数字」；空格也能当一个词）</label>
    <div id="words" class="chips"></div>
    <div class="row">
      <input id="newword" type="text" placeholder="新增一个词，例如 西瓜虫">
      <button id="add">添加</button>
      <button id="preset3">粘粘虫/扁扁虫/西瓜虫</button>
      <button id="reset">重置</button>
    </div>
    <div id="info" class="info"></div>
  </section>

  <section class="card">
    <label>配置 2 · 头尾（最前 / 最后一个固定的词）</label>
    <div class="row">
      <label class="inline">头词 <input id="start" type="text" value="咩"></label>
      <label class="inline">尾词 <input id="end" type="text" value="🌧️"></label>
      <button id="noframe">清空头尾</button>
    </div>
    <div class="row">
      <button id="preset_emoji">整套：咩/🐟/🌧（默认）</button>
      <button id="preset_mie">整套：咩语（咩/空格，头尾咩）</button>
      <button id="preset_worm">整套：粘粘虫语（粘粘虫/扁扁虫，无头尾）</button>
    </div>
    <div class="info">例：词表 咩/空格 + 头尾咩 → <b>咩 咩咩 咩 咩</b>（咩/空格本身是编码词，无分隔符）</div>
  </section>

  <section class="card">
    <div class="panes">
      <div>
        <label>输入</label>
        <textarea id="input" placeholder="在这里粘贴文字（编码），或粘贴虫语（解码）…"></textarea>
      </div>
      <div>
        <label>输出</label>
        <textarea id="output" readonly placeholder="结果会出现在这里"></textarea>
      </div>
    </div>
    <div class="row">
      <button id="enc" class="primary">编码 → 虫语</button>
      <button id="dec">解码 → 文字</button>
      <button id="swap">用输出当输入</button>
      <button id="copy">复制输出</button>
    </div>
    <div id="stat" class="info"></div>
  </section>
</main>

<script type="module">
import init, { encode, decode, block_info } from './pkg/wormlang.js';

await init();

const $ = (id) => document.getElementById(id);
let words = ['咩', ' ', '🐟️', '🌧️'];

function renderWords() {
  const box = $('words');
  box.innerHTML = '';
  words.forEach((w, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    const label = document.createElement('b');
    label.textContent = w === ' ' ? '␣（空格）' : w;
    const del = document.createElement('button');
    del.textContent = '×';
    del.title = '删除';
    del.disabled = words.length <= 2;
    del.onclick = () => { words.splice(i, 1); renderWords(); };
    chip.append(label, del);
    box.append(chip);
  });
  updateInfo();
}

function updateInfo() {
  const info = $('info');
  try {
    const text = block_info(words.join(','));
    info.className = 'info';
    info.innerHTML = `${words.length} 个词 · <b>${text}</b>`;
  } catch (e) {
    info.className = 'info err';
    info.textContent = '词表非法：' + e;
  }
}

function setStat(msg, err = false) {
  const stat = $('stat');
  stat.className = 'info' + (err ? ' err' : '');
  stat.innerHTML = msg;
}

$('add').onclick = () => {
  const value = $('newword').value.trim();
  if (!value) return;
  if (words.includes(value)) { setStat('已经有这个词了', true); return; }
  words.push(value);
  $('newword').value = '';
  renderWords();
};
$('newword').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });
$('preset3').onclick = () => { words = ['粘粘虫', '扁扁虫', '西瓜虫']; renderWords(); };
$('reset').onclick = () => { words = ['粘粘虫', '扁扁虫']; renderWords(); };
$('noframe').onclick = () => { $('start').value = ''; $('end').value = ''; };
$('preset_emoji').onclick = () => { words = ['咩', ' ', '🐟️', '🌧️']; $('start').value = '咩'; $('end').value = '🌧️'; renderWords(); };
$('preset_worm').onclick = () => { words = ['粘粘虫', '扁扁虫']; $('start').value = ''; $('end').value = ''; renderWords(); };
$('preset_mie').onclick = () => { words = ['咩', ' ']; $('start').value = '咩'; $('end').value = '咩'; renderWords(); };

const frame = () => [$('start').value || undefined, $('end').value || undefined];

$('enc').onclick = () => {
  try {
    const [start, end] = frame();
    const out = encode($('input').value, words.join(','), start, end);
    $('output').value = out;
    setStat(`输入 <b>${[...$('input').value].length}</b> 字 → 虫语 <b>${[...out].length}</b> 字`);
  } catch (e) { setStat(String(e), true); }
};

$('dec').onclick = () => {
  try {
    const [start, end] = frame();
    const out = decode($('input').value.trim(), words.join(','), start, end);
    $('output').value = out;
    setStat(`解码成功，<b>${[...out].length}</b> 字`);
  } catch (e) { setStat(String(e), true); }
};

$('swap').onclick = () => { $('input').value = $('output').value; };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('output').value); setStat('已复制到剪贴板 ✓'); }
  catch { setStat('复制失败，请手动选中', true); }
};

renderWords();
</script>
</body>
</html>
